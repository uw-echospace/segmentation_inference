[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "segmentation_inference"
description = "Detecting fish presence in processed echo data."
readme = "README.md"
version = "0.0"
requires-python = ">=3.13,<3.15"

authors = [
    { name = "Caesar Tuguinay", email = "ctuguina@uw.edu" },
]

maintainers = [
    { name = "Caesar Tuguinay", email = "ctuguina@uw.edu" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "torch",
    "torchvision",
]

[project.urls]
Homepage = "https://github.com/echostack-org/echoregions"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "build",
    "zarr",
    "netcdf4",
    "xarray",
]

[tool.uv.build-backend]
module-name = "segmentation_inference"
module-root = "."

[tool.black]
line-length = 100

[tool.isort]
known_first_party = ["segmentation_inference"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 100
